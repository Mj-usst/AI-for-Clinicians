<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 438" role="img" aria-labelledby="title desc"><title id="title">Lesson workflow</title><desc id="desc">Six steps: question, search, evidence table, error check, independent work and revision.</desc><rect x="0" y="0" width="1120" height="438" rx="20" fill="#F5F9FA"/><text x="36" y="53" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="30" font-weight="600" fill="#163C4D">One lesson. One evidence-backed output.</text><rect x="36" y="84" width="335" height="141" rx="14" fill="#FFFFFF" stroke="#D7E3E8"/><text x="56" y="120" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="600" fill="#337D78">01</text><text x="56" y="161" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="600" fill="#173D49">Frame the question</text><text x="56" y="196" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#55717F">People, task and comparison</text><rect x="392" y="84" width="335" height="141" rx="14" fill="#FFFFFF" stroke="#D7E3E8"/><text x="412" y="120" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="600" fill="#337D78">02</text><text x="412" y="161" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="600" fill="#173D49">Log the search</text><text x="412" y="196" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#55717F">Save queries and decisions</text><rect x="748" y="84" width="335" height="141" rx="14" fill="#FFFFFF" stroke="#D7E3E8"/><text x="768" y="120" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="600" fill="#337D78">03</text><text x="768" y="161" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="600" fill="#173D49">Build the table</text><text x="768" y="196" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#55717F">One study, one evidence row</text><rect x="36" y="250" width="335" height="141" rx="14" fill="#FFFFFF" stroke="#D7E3E8"/><text x="56" y="286" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="600" fill="#337D78">04</text><text x="56" y="327" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="600" fill="#173D49">Find the errors</text><text x="56" y="362" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#55717F">Check units and comparisons</text><rect x="392" y="250" width="335" height="141" rx="14" fill="#FFFFFF" stroke="#D7E3E8"/><text x="412" y="286" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="600" fill="#337D78">05</text><text x="412" y="327" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="600" fill="#173D49">Work independently</text><text x="412" y="362" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#55717F">Write a bounded conclusion</text><rect x="748" y="250" width="335" height="141" rx="14" fill="#FFFFFF" stroke="#D7E3E8"/><text x="768" y="286" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="600" fill="#337D78">06</text><text x="768" y="327" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="25" font-weight="600" fill="#173D49">Review and revise</text><text x="768" y="362" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#55717F">Keep a record of changes</text></svg>
